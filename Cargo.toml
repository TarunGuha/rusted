[package]
name = "rusted"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-service = "2.0"

cron = "0.15.0"
chrono = "0.4.41"

env_logger = "0.11.8"

log = "0.4.27"

jsonwebtoken = "9.3.1"

redis = "0.31.0"

serde_json = "1.0.140"
serde = { version = "1.0", features = ["derive"] }

utoipa = "5"
validator = { version = "0.20.0", features = ["derive"] }

tokio = { version = "1", features = ["full"] }